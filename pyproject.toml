[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studylapse"
version = "1.0.0"
description = "Lightweight webcam + screen timelapse recorder for study sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "mss>=9.0",
    "jeepney>=0.8; sys_platform == 'linux'",
    "pygrabber>=0.2; sys_platform == 'win32'",
]

[project.gui-scripts]
studylapse = "studylapse.app:main"

[tool.setuptools]
packages = ["studylapse", "studylapse.ui"]
